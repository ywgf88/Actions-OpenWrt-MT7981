#
# Build OpenWrt (official source, v25.12.2) for CMCC RAX3000M / Qihoo 360T7 / Cetron CT3003 (U-Boot layout)
# Target: mediatek/filogic (MT7981B)
# Features: IPv4-only / Vantage theme / PassWall2 / SQM / DDNS / WOL / nlbwmon / UPnP / WireGuard
#
name: OpenWrt Builder
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.2
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  CLEAN_WORKFLOW_RUNS: 'false'
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@main
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a
    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
    - name: Validate target config
      run: |
        set -e
        cd openwrt
        # Windows 上传的 .config 可能带 CRLF，Kconfig 会整行跳过 CONFIG
        sed -i 's/\r$//' .config
        make defconfig
        # 若某设备的 DEVICE_ 符号被 make defconfig 静默丢弃，直接补写回 .config 再解析一次
        # （旧版教程里的 ./scripts/config -e 在 v25.12.2 不可用：scripts/config 已是目录，会报 exit 126）
        for dev in cmcc_rax3000m qihoo_360t7 cetron_ct3003_ubootmod; do
          grep -qE "^CONFIG_TARGET_(DEVICE_)?mediatek_filogic_DEVICE_${dev}=y" .config \
            || { echo "补写设备符号：${dev}"; echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${dev}=y" >> .config; }
        done
        make defconfig
        echo "==== defconfig 后实际选中的设备项 ===="
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config || true
        echo "==== 关键配置检查 ===="
        for dev in cmcc_rax3000m qihoo_360t7 cetron_ct3003_ubootmod; do
          grep -qE "^CONFIG_TARGET_(DEVICE_)?mediatek_filogic_DEVICE_${dev}=y" .config \
            || { echo "❌ 未选中设备 ${dev}"; exit 1; }
        done
        grep -q '^CONFIG_PACKAGE_luci-app-passwall2=y' .config || echo "::warning::PassWall2 未选中，请检查 feeds 与 .config"
        grep -q '^CONFIG_PACKAGE_luci-theme-vantage=y' .config || echo "::warning::Vantage 主题未选中，请检查 diy-part1.sh"
        echo "==== 家庭场景插件检查 ===="
        # 包名写错时 make defconfig 会静默丢弃该符号且不报错，这里硬拦，避免编出缺插件的固件
        missing=""
        for pkg in luci-app-sqm luci-app-ddns luci-app-wol luci-app-nlbwmon luci-app-upnp luci-proto-wireguard luci-app-commands; do
          grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || missing="$missing ${pkg}"
        done
        if [ -n "$missing" ]; then
          echo "::error::以下插件未被解析，包名可能不在 feeds：${missing}"
          exit 1
        fi
        echo "✅ 7 个家庭场景插件已全部选中"
        echo "版本号：$(grep '^CONFIG_VERSION_NUMBER' .config || true)"
        echo "IPv6 组件 odhcp6c：$(grep -c '^CONFIG_PACKAGE_odhcp6c=y' .config || true)"
    - name: Download package
      id: package
      run: |
        set -e
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    - name: Compile the firmware
      id: compile
      run: |
        set -e
        cd openwrt
        echo -e "$(nproc) thread compile"
        if make -j$(nproc) || make -j1 || make -j1 V=s; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "::error::编译失败，请查看上方 make 输出"
          exit 1
        fi
        # 收集所有已选设备名，拼到产物名里
        echo "==== 关键产物检查：CT3003 必须是 ubootmod 的 itb ===="
        ls -l bin/targets/mediatek/filogic/*cetron_ct3003-ubootmod*sysupgrade.itb \
          || { echo "::error::CT3003 没有生成 ubootmod 的 .itb 产物，请检查 filogic.mk 注入与设备符号"; exit 1; }
        devices=$(grep -oE '^CONFIG_TARGET_DEVICE_[^=]+=y' .config | sed -E 's/.*DEVICE_//; s/=y$//' | sort -u | paste -sd_ -)
        if [ -z "$devices" ]; then
          devices=$(ls bin/targets/mediatek/filogic/*squashfs-sysupgrade* 2>/dev/null \
                    | sed -E 's#^.*/openwrt-[^/]*-mediatek-filogic-##; s#-squashfs-sysupgrade.*$##' \
                    | sort -u | paste -sd_ -)
        fi
        [ -z "$devices" ] && devices=mediatek_filogic
        echo "DEVICE_NAME=_${devices}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
    - name: Check space usage
      if: (!cancelled())
      run: df -hT
    - name: List firmware images
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/mediatek/filogic
        ls -lh
        echo "==== sysupgrade 产物 ===="
        ls -1 *sysupgrade*.itb *sysupgrade*.bin 2>/dev/null || true
    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        set -e
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # 清理：去掉 RAX3000M 的 eMMC 相关文件
        rm -f *emmc*
        rm -f mt7986-* mt7987-* mt7988-*
        # 同步清掉 sha256sums 里对应的行
        [ -f sha256sums ] && sed -i '/emmc/d' sha256sums || true
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT
    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.compile.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      if: steps.compile.outputs.status == 'success' && env.CLEAN_WORKFLOW_RUNS == 'true'
      with:
        retain_days: 0
        keep_minimum_runs: 2
    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
